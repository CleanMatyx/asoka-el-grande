services:
  web:
    image: nginx:1.27-alpine
    ports: ["${APP_PORT:-8080}:80"]
    volumes: [".:/var/www/html", "./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [app]
  app:
    build: { context: ., dockerfile: docker/php/Dockerfile }
    volumes: [".:/var/www/html"]
    depends_on:
      db: { condition: service_healthy }
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-asoka}
      MYSQL_USER: ${DB_USERNAME:-asoka}
      MYSQL_PASSWORD: ${DB_PASSWORD:-asoka_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    ports: ["${DB_PORT_FORWARD:-3307}:3306"]
    volumes: ["asoka_mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes: { asoka_mysql: {} }
